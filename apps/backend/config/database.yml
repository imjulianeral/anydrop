default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  connect_timeout: 5

<%
  raw_url = ENV["DIRECT_URL"].to_s
  raw_url = ENV["DATABASE_URL"].to_s if raw_url.empty?
  postgres_url = raw_url if raw_url.match?(/\Apostgres(?:ql)?:\/\//i)
%>

development:
  <<: *default
  <% if postgres_url %>
  url: "<%= postgres_url %>"
  <% end %>

test:
  <<: *default
  <% test_url = ENV["TEST_DATABASE_URL"].to_s
     test_url = raw_url if test_url.empty? %>
  <% if test_url.match?(/\Apostgres(?:ql)?:\/\//i) %>
  url: "<%= test_url %>"
  <% end %>

production:
  <<: *default
  <% if postgres_url %>
  url: "<%= postgres_url %>"
  <% end %>
